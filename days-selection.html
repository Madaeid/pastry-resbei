<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="/pwa-192x192.png">
    <title>📅 Daily Menu - Select Day</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="./services/app-guard.ts"></script>
</head>

<body>
    <!-- Page Header -->
    <div class="daily-menu-header">
        <div class="header-brand">
            <a href="./index.html" class="back-link">
                <span>←</span>
                <span data-i18n="backToRecipes">Back to Recipes</span>
            </a>
        </div>
        <div class="header-title">
            <span class="header-icon-emoji">📅</span>
            <h1 data-i18n="dailyMenu">Daily Menu</h1>
        </div>
        <div class="header-actions">
            <button class="btn-logout" id="logoutBtn">
                <span>🚪</span>
                <span data-i18n="logout">Logout</span>
            </button>
        </div>
    </div>

    <!-- Floating Particles Background -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Decorative Gradient Orbs -->
    <div class="decorative-orb orb-1"></div>
    <div class="decorative-orb orb-2"></div>
    <div class="decorative-orb orb-3"></div>

    <!-- Main Content -->
    <div class="days-selection-container">
        <div class="days-selection-header">
            <h2>🗓️ <span data-i18n="chooseADay">Choose a Day</span></h2>
            <p data-i18n="selectDayToView">Select a day to view or add your recipes</p>
        </div>

        <div class="days-grid" id="daysGrid">
            <!-- Days will be dynamically inserted here -->
        </div>

        <!-- Shopping List Button -->
        <div style="text-align: center; margin-top: 35px;">
            <button class="btn-shopping-list" id="shoppingListBtn">
                <span>🛒</span>
                <span>Generate Shopping List</span>
            </button>
        </div>
    </div>

    <!-- Shopping List Modal -->
    <div id="shoppingListModal" class="modal">
        <div class="modal-content modal-lg">
            <button class="modal-close" id="closeShoppingListModal">&times;</button>
            <div class="modal-header" style="text-align: center; margin-bottom: 5px;">
                <h2>🛒 Weekly Shopping List</h2>
                <p class="shopping-list-subtitle" id="shoppingListSubtitle">Loading ingredients from your meal plan...</p>
            </div>

            <!-- Filter tabs -->
            <div class="shopping-filter-tabs" id="shoppingFilterTabs">
                <button class="shopping-tab active" data-filter="all">📋 All</button>
            </div>

            <!-- Shopping list container -->
            <div class="shopping-list-body" id="shoppingListBody">
                <!-- Categories and items will be rendered here -->
            </div>

            <!-- Actions -->
            <div class="shopping-list-actions">
                <button class="btn btn-secondary" id="shoppingCopyBtn">
                    <span>📋</span> Copy to Clipboard
                </button>
                <button class="btn btn-secondary" id="shoppingExportBtn">
                    <span>📄</span> Export as Text
                </button>
                <button class="btn btn-primary" id="shoppingShareBtn" style="display: none;">
                    <span>🔗</span> Share
                </button>
                <button class="btn btn-secondary" id="shoppingClearChecked">
                    <span>✅</span> Clear Checked
                </button>
            </div>
        </div>
    </div>

    <footer>
        <p data-i18n="dailyMenuFooter">📅 Daily Menu - Chef Book © 2024</p>
    </footer>

    <script type="module" src="./days-selection.js"></script>
</body>

</html>
