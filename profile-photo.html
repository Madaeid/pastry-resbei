<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="/pwa-192x192.png">
    <title>Chef Gallery - Chef Book</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .photo-page-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .photo-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        [data-theme="light"] .photo-card {
            background: rgba(255, 255, 255, 0.82);
            border-color: rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* Gallery Styles */
        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .gallery-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            align-items: start;
        }

        /* Lightbox Styles */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            z-index: 2000;
            cursor: zoom-out;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.show {
            display: flex;
            opacity: 1;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: white;
            cursor: pointer;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: zoom-in;
            background: rgba(255, 255, 255, 0.02);
            height: fit-content;
        }

        .gallery-item:hover {
            transform: scale(1.02);
            border-color: var(--accent-pink);
        }

        .gallery-item img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 16px;
            margin: auto;
        }

        .gallery-item-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .gallery-item-overlay {
            opacity: 1;
        }

        .btn-gallery-action {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .btn-gallery-action:hover {
            background: var(--accent-pink);
            border-color: var(--accent-pink);
        }

        .btn-add-to-gallery {
            background: var(--accent-pink);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-add-to-gallery:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 138, 0.3);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .empty-gallery {
            grid-column: 1 / -1;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 2px dashed rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
        }
    </style>
    <script>
        // Immediate theme initialization
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>

<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="photo-page-container">
        <a href="index.html#my-recipes" class="back-link">
            <span>⬅️</span> Back to Chef Book
        </a>

        <div class="photo-card">
            <!-- Gallery Section -->
            <div class="gallery-section">
                <div class="gallery-header">
                    <h2 class="gallery-title">🖼️ Chef Gallery</h2>
                    <button id="addToGalleryBtn" class="btn-add-to-gallery">
                        <span>➕</span> Add More Photo
                    </button>
                    <input type="file" id="galleryInput" accept="image/*" multiple style="display: none;">
                </div>

                <div id="galleryGrid" class="gallery-grid">
                    <!-- Photos will be added here dynamically -->
                </div>

                <p id="galleryStatus" style="font-size: 0.8rem; color: var(--text-secondary); text-align: left;"></p>
            </div>
        </div>
    </div>

    <!-- Lightbox for Full View -->
    <div id="photoLightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-lightbox">✖</span>
        <img id="lightboxImg" src="" alt="Full view">
    </div>

    <script type="module">
        import { getCurrentUser, updateUser, getAllUsers, fetchUserProfile } from './auth.js';
        import { initLanguage } from './language.js';

        // Elements
        const galleryGrid = document.getElementById('galleryGrid');
        const galleryInput = document.getElementById('galleryInput');
        const addToGalleryBtn = document.getElementById('addToGalleryBtn');
        const galleryStatus = document.getElementById('galleryStatus');

        const lightbox = document.getElementById('photoLightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        let userGallery = [];
        let isSaving = false;

        // Initialize
        async function init() {
            initLanguage();

            const currentUser = getCurrentUser();
            if (!currentUser) {
                window.location.href = 'auth.html';
                return;
            }

            // Always try to fetch from backend first
            galleryStatus.textContent = '🔄 Syncing with Postgres...';
            const result = await fetchUserProfile();

            if (result.success && result.user) {
                userGallery = result.user.gallery || [];
                galleryStatus.textContent = '✅ Sync complete';
                setTimeout(() => galleryStatus.textContent = '', 2000);
            } else {
                // Fallback to local storage if offline or error
                const users = getAllUsers();
                const user = users.find(u => u.username === currentUser);
                if (user) {
                    userGallery = user.gallery || [];
                }
                galleryStatus.textContent = '⚠️ Offline mode: Loading from local storage';
                setTimeout(() => galleryStatus.textContent = '', 3000);
            }

            renderGallery();
        }

        // --- Gallery Logic ---
        addToGalleryBtn.addEventListener('click', () => galleryInput.click());

        galleryInput.addEventListener('change', async function (e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            galleryStatus.textContent = `Processing ${files.length} items...`;

            for (const file of files) {
                if (file.size > 1024 * 1024) {
                    galleryStatus.textContent = '❌ Some images were skipped (too large, >1MB)';
                    continue;
                }

                const data = await readFileAsDataURL(file);
                if (!userGallery.includes(data)) {
                    userGallery.push(data);
                }
            }

            await syncGallery();
            renderGallery();
            galleryStatus.textContent = '✅ Gallery updated!';
            setTimeout(() => galleryStatus.textContent = '', 3000);
        });

        async function syncGallery() {
            const currentUser = getCurrentUser();
            await updateUser(currentUser, { gallery: userGallery });
            console.log('Gallery synced');
        }

        function renderGallery() {
            galleryGrid.innerHTML = '';

            if (userGallery.length === 0) {
                galleryGrid.innerHTML = '<div class="empty-gallery">No extra photos in your gallery yet. Click above to add some!</div>';
                return;
            }

            userGallery.forEach((photo, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';

                item.innerHTML = `
                    <img src="${photo}" alt="Gallery item">
                    <div class="gallery-item-overlay">
                        <button class="btn-gallery-action" onclick="setAsProfile(${index})">⭐ Use as Profile</button>
                        <button class="btn-gallery-action" onclick="deleteFromGallery(${index})" style="background: rgba(239, 68, 68, 0.4)">🗑️ Delete</button>
                    </div>
                `;

                // Open lightbox on click (unless a button is clicked)
                item.onclick = (e) => {
                    if (e.target.tagName !== 'BUTTON') {
                        openLightbox(photo);
                    }
                };

                galleryGrid.appendChild(item);
            });
        }

        window.setAsProfile = async (index) => {
            const photo = userGallery[index];
            const currentUser = getCurrentUser();
            const result = await updateUser(currentUser, { profilePicture: photo });

            if (result.success) {
                galleryStatus.textContent = '✅ Set as profile photo!';
                setTimeout(() => galleryStatus.textContent = '', 3000);
            } else {
                galleryStatus.textContent = '❌ Failed to set profile photo';
            }
        };

        window.deleteFromGallery = async (index) => {
            if (!confirm('Are you sure you want to remove this photo?')) return;
            userGallery.splice(index, 1);
            await syncGallery();
            renderGallery();
        };

        // --- Lightbox Functions ---
        window.openLightbox = (src) => {
            lightboxImg.src = src;
            lightbox.classList.add('show');
            document.body.style.overflow = 'hidden'; // Prevent scrolling
        };

        window.closeLightbox = () => {
            lightbox.classList.remove('show');
            document.body.style.overflow = ''; // Restore scrolling
        };

        // Close on Esc key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        // --- Helpers ---
        function readFileAsDataURL(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        init();
    </script>
</body>

</html>
